apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-microservice
  namespace: statex-apps
  labels:
    app: catalog-microservice
    managed-by: k8s-migration
spec:
  # Single node, 110-pod ceiling: a second replica of a service with no
  # HA requirement buys nothing (both pods sit on the same node, so it is not
  # fault tolerance) and costs a slot that rollouts need for their surge pod.
  replicas: 1
  selector:
    matchLabels:
      app: catalog-microservice
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: catalog-microservice
    spec:
      containers:
        - name: app
          image: localhost:5000/catalog-microservice:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3200
          env:
            - name: LOGGING_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: logging-ingest-credentials
                  key: LOGGING_SERVICE_TOKEN
          envFrom:
            - configMapRef:
                name: catalog-microservice-config
            - secretRef:
                name: catalog-microservice-secret
          startupProbe:
            httpGet:
              path: /health
              port: 3200
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3200
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3200
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
