apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-microservice-config
  namespace: statex-apps
  labels:
    app: catalog-microservice
    managed-by: k8s-migration
data:
  NODE_ENV: "production"
  SERVICE_NAME: "catalog-microservice"
  DOMAIN: "catalog.alfares.cz"
  PORT: "3200"
  DB_HOST: "db-server-postgres"
  DB_PORT: "5432"
  DB_USER: "dbadmin"
  DB_NAME: "catalog_db"
  DB_SYNC: "false"
  DB_AUTO_CREATE: "true"
  LOG_LEVEL: "info"
  LOGGING_SERVICE_URL: "http://logging-microservice.statex-apps.svc.cluster.local:3367"
  AUTH_SERVICE_URL: "http://auth-microservice.statex-apps.svc.cluster.local:3370"
