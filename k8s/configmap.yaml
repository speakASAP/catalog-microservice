apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-microservice-config
  namespace: statex-apps
  labels:
    app: catalog-microservice
    managed-by: k8s-migration
data:
  NODE_ENV: "production"
  SERVICE_NAME: "catalog-microservice"
  DOMAIN: "catalog.alfares.cz"
  PORT: "3200"
  DB_HOST: "db-server-postgres"
  DB_PORT: "5432"
  DB_USER: "dbadmin"
  DB_NAME: "catalog_db"
  DB_SYNC: "false"
  DB_AUTO_CREATE: "true"
  LOG_LEVEL: "info"
  LOGGING_SERVICE_URL: "http://logging-microservice.statex-apps.svc.cluster.local:3367"
  AUTH_SERVICE_URL: "http://auth-microservice.statex-apps.svc.cluster.local:3370"
  BAZOS_SERVICE_URL: "http://bazos-service.statex-apps.svc.cluster.local:3000"
  WAREHOUSE_SERVICE_URL: "http://warehouse-microservice.statex-apps.svc.cluster.local:3201"
  WAREHOUSE_AVAILABILITY_TIMEOUT_MS: "5000"
  ORDERS_SERVICE_URL: "http://orders-microservice.statex-apps.svc.cluster.local:3203"
  ORDERS_STATISTICS_TIMEOUT_MS: "5000"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
  CATALOG_EVENTS_RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
  CATALOG_EVENT_PUBLISHER_ENABLED: "true"
  CATALOG_EVENT_OUTBOX_BATCH_SIZE: "25"
  CATALOG_EVENT_OUTBOX_REPLAY_INTERVAL_MS: "60000"
  CATALOG_EVENT_OUTBOX_RETRY_DELAY_MS: "30000"
  CATALOG_EVENT_OUTBOX_RETRY_MAX_DELAY_MS: "300000"
  CATALOG_EVENT_OUTBOX_MAX_ATTEMPTS: "12"
  CATALOG_MEDIA_S3_ENDPOINT: "http://minio-microservice.statex-apps.svc.cluster.local:9000"
  CATALOG_MEDIA_PUBLIC_BASE_URL: "https://minio.alfares.cz"
  CATALOG_MEDIA_BUCKET: "catalog-media"
  CATALOG_MEDIA_S3_ACCESS_KEY: "minioadmin"
  CATALOG_MEDIA_S3_REGION: "us-east-1"
  CATALOG_MEDIA_PUBLIC_READ: "true"
