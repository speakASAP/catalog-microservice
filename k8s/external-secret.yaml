apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalog-microservice-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: catalog-microservice-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/prod/catalog-microservice
        property: DATABASE_URL
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/catalog-microservice
        property: DB_PASSWORD
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef:
        key: secret/prod/minio-microservice
        property: MINIO_ROOT_PASSWORD

    # Auth-issued RS256 service principal for catalog-contract-monitor
    # (svc-catalog-contract-monitor--catalog-microservice@internal.alfares.cz,
    # role internal:catalog-microservice:service). Replaces the legacy shared
    # JWT_TOKEN, which was a legacy hand-minted HS256 value that /auth/validate rejects
    # outright with "Unsupported token algorithm HS256; RS256 required".
    - secretKey: CATALOG_MONITOR_AUTH_TOKEN
      remoteRef:
        key: secret/prod/catalog-microservice
        property: CATALOG_MONITOR_AUTH_TOKEN
    - secretKey: WAREHOUSE_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/auth-microservice
        property: CATALOG_WAREHOUSE_SERVICE_TOKEN
    - secretKey: CATALOG_SMOKE_BAZOS_PRODUCT_ID
      remoteRef:
        key: secret/prod/catalog-microservice
        property: CATALOG_SMOKE_BAZOS_PRODUCT_ID
    - secretKey: CATALOG_SMOKE_BAZOS_IDENTITY_ID
      remoteRef:
        key: secret/prod/catalog-microservice
        property: CATALOG_SMOKE_BAZOS_IDENTITY_ID
    - secretKey: CATALOG_SMOKE_BAZOS_CATEGORY
      remoteRef:
        key: secret/prod/catalog-microservice
        property: CATALOG_SMOKE_BAZOS_CATEGORY
    - secretKey: CATALOG_SMOKE_BAZOS_LOCATION
      remoteRef:
        key: secret/prod/catalog-microservice
        property: CATALOG_SMOKE_BAZOS_LOCATION
    - secretKey: BAZOS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/catalog-microservice
        property: BAZOS_SERVICE_TOKEN
    - secretKey: CATALOG_INTERNAL_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/auth-microservice
        property: CATALOG_INTERNAL_SERVICE_TOKEN
    - secretKey: CATALOG_BPCP_EVENTS_RABBITMQ_URL
      remoteRef:
        key: secret/prod/runlayer
        property: RABBITMQ_URL
    - secretKey: BPCP_PROCESS_SIGNING_SECRET
      remoteRef:
        key: secret/prod/business-process-control-plane
        property: BPCP_PROCESS_SIGNING_SECRET
    # Ingest credential for posting credential self-reports to monitoring
    # (SERVICE_CREDENTIAL_PROBER_PLAN.md Task A). Not a probe credential: it
    # authenticates the report, never the lane being reported on.
    #
    # NOTE the property name is PLURAL. monitoring's own ExternalSecret maps env
    # NOTIFICATION_SERVICE_TOKEN <- Vault NOTIFICATIONS_SERVICE_TOKEN, and
    # MonitoringIngestGuard compares against that running value. The singular key
    # also exists in monitoring's path with a different, stale value; using it
    # yields a token the guard rejects with 403 while the probe itself succeeds.
    - secretKey: NOTIFICATION_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/monitoring-microservice
        property: NOTIFICATIONS_SERVICE_TOKEN
    # Per-pair RS256 principal for catalog-microservice -> itself
    # (svc-catalog-microservice--catalog-microservice@internal.alfares.cz),
    # role internal:catalog-microservice:service.
    #
    # A self-pair looks odd but is the correct shape: the flipflop-projection
    # batch route is reached over HTTP rather than in-process, because
    # FlipFlopProjectionModule already imports ProductsModule and injecting it
    # back into ProductsService would be a circular dependency. An HTTP call to
    # itself is still a (caller -> target) pair and needs a real principal; the
    # shared static token it replaces was the last thing pinning
    # 'catalog-microservice' into the internal-service allowlist.
    - secretKey: CATALOG_SELF_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/catalog-microservice
        property: CATALOG_SELF_SERVICE_TOKEN
    # Per-pair RS256 principals for catalog's OUTBOUND lanes. Catalog is a
    # caller here, not the receiver, and both lanes previously fell through to
    # the shared CATALOG_INTERNAL_SERVICE_TOKEN when no dedicated credential was
    # set -- which is how a receiver-side migration can silently leave the same
    # service still sending the prohibited header outbound.
    - secretKey: ORDERS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/catalog-microservice
        property: ORDERS_SERVICE_TOKEN
    - secretKey: HEUREKA_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/catalog-microservice
        property: HEUREKA_SERVICE_TOKEN
