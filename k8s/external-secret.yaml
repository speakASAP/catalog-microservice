apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalog-microservice-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: catalog-microservice-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/prod/catalog-microservice
        property: DATABASE_URL
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/catalog-microservice
        property: DB_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/prod/auth-microservice
        property: JWT_SECRET
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef:
        key: secret/prod/minio-microservice
        property: MINIO_ROOT_PASSWORD

    - secretKey: JWT_TOKEN
      remoteRef:
        key: secret/prod/catalog-microservice
        property: JWT_TOKEN
