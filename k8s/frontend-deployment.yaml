apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-frontend
  namespace: statex-apps
  labels:
    app: catalog-frontend
    managed-by: k8s-migration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: catalog-frontend
    spec:
      containers:
        - name: app
          image: localhost:5000/catalog-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_PUBLIC_API_URL
              value: "https://catalog.alfares.cz/api"
            - name: NEXT_PUBLIC_AUTH_SERVICE_URL
              value: "https://catalog.alfares.cz/api/auth"
          startupProbe:
            httpGet:
              path: /
              port: 3000
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
