apiVersion: batch/v1
kind: CronJob
metadata:
  name: catalog-contract-monitor
  namespace: statex-apps
  labels:
    app: catalog-contract-monitor
    component: contract-monitor
    managed-by: k8s-migration
spec:
  # Runs again as of 2026-08-03, with the side-effect check left off.
  #
  # History: every run failed on the authorized-bazos-draft contract —
  #   "Set CATALOG_SMOKE_ENABLE_BAZOS_AUTHORIZED=true with approved Bazos
  #    identity/category inputs to run this side-effect-risk check."
  # That check posts real Bazos drafts, so it stays off until someone supplies
  # approved identity/category inputs through secret/prod/catalog-microservice.
  # It is a third-party side effect, not a default.
  #
  # The job was then suspended entirely, which fixed the noise but stopped the
  # other eleven contract checks with it. With
  # CATALOG_MONITOR_INCLUDE_BAZOS_AUTHORIZED=false the run is green — measured
  # 2026-08-03: 11 passed, 0 failed, 4 skipped — so there is no longer a reason
  # to keep it suspended. A monitor that does not run reports nothing, which
  # looks exactly like a monitor reporting no problems.
  #
  # The other three skips (authorized-channel-status,
  # authorized-heureka-readiness, authorized-stock-consistency) are read-only by
  # their own definitions but call live third-party APIs, so enabling them is
  # the owner's call rather than a default.
  suspend: false
  # Staggered off the :00/:30 marks shared by cliplot-readiness-monitor and
  # others. See shared/docs/DEPLOY_STANDARDIZATION_REPORT.md section 12 addendum.
  schedule: "14,44 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: catalog-contract-monitor
            component: contract-monitor
        spec:
          restartPolicy: Never
          containers:
            - name: monitor
              image: localhost:5000/catalog-microservice:latest
              imagePullPolicy: Always
              command: ["node", "scripts/catalog-contract-monitor.js"]
              envFrom:
                - configMapRef:
                    name: catalog-microservice-config
                - secretRef:
                    name: catalog-microservice-secret
              env:
                - name: CATALOG_SMOKE_BASE_URL
                  value: "http://catalog-microservice.statex-apps.svc.cluster.local:3200"
                - name: CATALOG_MONITOR_AUTHORIZED
                  value: "true"
                - name: CATALOG_MONITOR_INCLUDE_BAZOS_AUTHORIZED
                  value: "false"
                # catalog-smoke.js already retries transport errors, but 3x1000ms only
                # spans ~3s -- too short for the ClusterIP blips that failed every
                # contract with "fetch failed". Widened to ~32s; timeout raised to
                # keep headroom for the longer retry window across both profiles.
                - name: CATALOG_MONITOR_TIMEOUT_MS
                  value: "300000"
                - name: CATALOG_SMOKE_RETRIES
                  value: "4"
                - name: CATALOG_SMOKE_RETRY_DELAY_MS
                  value: "8000"
                # Empty-string literal here sent the smoke run out with no
                # credential at all, so every authorized contract 401'd. The
                # value is already synced from Vault into this secret by
                # external-secret.yaml, exactly like the token below it.
                - name: JWT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: catalog-microservice-secret
                      key: JWT_TOKEN
                - name: CATALOG_SMOKE_INTERNAL_SERVICE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: catalog-microservice-secret
                      key: CATALOG_INTERNAL_SERVICE_TOKEN
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "25m"
                limits:
                  memory: "256Mi"
                  cpu: "250m"
