apiVersion: v1
kind: Service
metadata:
  name: catalog-frontend
  namespace: statex-apps
  labels:
    app: catalog-frontend
    managed-by: k8s-migration
spec:
  type: ClusterIP
  selector:
    app: catalog-frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      name: app
